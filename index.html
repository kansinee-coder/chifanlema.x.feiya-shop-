<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chifanlema.x.Feiya — สั่งขนมออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1f4f7d; --primary-2:#4fb3e0; --sky:#7fd0f2; --sky-soft:#e3f4fc;
  --matcha:#8cc63f; --matcha-dk:#4f8f2a; --matcha-soft:#eaf6d8;
  --coral:#ff8a65; --coral-dk:#e0623d;
  --cream:#f4fbfe; --ink:#1f3550; --muted:#5f7286; --line:#d6ecf7; --card:#ffffff;
  --soft:#e8f5fc; --note:#fff4e3; --off:#c7d6e0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Prompt',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:110px}
header{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;padding:28px 16px 24px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:var(--matcha)}
header h1{font-size:28px;font-weight:600;letter-spacing:.3px}
header h1 .x{color:#c8e6a8}
@media (max-width:360px){header h1{font-size:24px}}
header p{opacity:.9;font-size:14px;margin-top:4px}
.ig{display:inline-block;margin-top:10px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px;font-size:13px;color:#fff;text-decoration:none}
main{max-width:640px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tabs button{flex:none;border:1.5px solid var(--primary);background:#fff;color:var(--primary);padding:7px 16px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--primary);color:#fff}
.card{box-shadow:0 1px 3px rgba(42,51,64,.04)}
.slipsteps{text-align:left;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px 10px 30px;margin:0 0 12px}
.slipsteps li{margin:3px 0}
.promo-banner{background:var(--matcha-soft);color:var(--matcha-dk);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;gap:12px;align-items:stretch}
.thumb{flex:none;width:96px;height:96px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:40px;overflow:hidden;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info .brand{font-size:12px;color:var(--muted)}
.info h3{font-size:15px;font-weight:600;line-height:1.35}
.info .cn{font-size:12px;color:var(--muted)}
.info .unit{font-size:12px;color:var(--muted);margin-top:2px}
.bottom{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:700;color:var(--primary);font-size:17px}
.stock{display:inline-block;font-size:12px;font-weight:600;margin-top:4px;color:#a0702a}
.stock.out{color:#a04040}
.card.out{opacity:.55}
.card.out .thumb img{filter:grayscale(1)}
.tag{display:inline-block;background:var(--matcha-soft);color:var(--matcha-dk);font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin-top:4px;align-self:flex-start}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-size:18px;line-height:1;cursor:pointer}
.qty button.plus{background:var(--primary);color:#fff}
.qty button:disabled{background:var(--off);border-color:var(--off);color:#fff;cursor:not-allowed}
.qty span{min-width:20px;text-align:center;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06);z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;font-size:13px;color:var(--muted)}
.bar .sum b{display:block;font-size:20px;color:var(--ink)}
.btn{background:var(--primary);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled{background:var(--off);cursor:not-allowed}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.sheet{position:fixed;inset:0;background:rgba(42,51,64,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--muted);padding-bottom:6px;border-bottom:3px solid var(--line)}
.steps div.on{color:var(--primary);font-weight:600;border-color:var(--primary)}
.steps div.done{color:var(--ink);border-color:var(--matcha)}
.panel h2{font-size:19px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0}
.line.disc{color:var(--matcha-dk)}
.line.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.weight{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
.opt.on{border-color:var(--primary);background:#f0f5fa}
.opt input{width:20px;height:20px;accent-color:var(--primary)}
.opt .t{flex:1}
.opt .t b{display:block;font-size:15px}
.opt .t small{color:var(--muted);font-size:12px}
.opt .p{font-weight:700;font-size:17px}
.warn{background:var(--note);border:1px solid #ecd9ad;border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input[type=text],input[type=tel],textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fdfcf9}
input:focus,textarea:focus{outline:none;border-color:var(--primary)}
.row2{display:flex;gap:10px}.row2>div{flex:1;min-width:0}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.pay{text-align:center}
.pay .amount{font-size:30px;font-weight:700;color:var(--primary);margin:4px 0 2px}
.qrbox{position:relative;display:inline-block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.qrbox img,.qrbox canvas{display:block;width:230px;height:230px;object-fit:contain}
.qrbox.real{padding:6px}
.qrbox.real img{width:260px;height:auto}
.savebtn{display:inline-block;margin:2px 0 10px;font-size:14px;color:var(--primary);font-weight:600;text-decoration:none;border:1.5px solid var(--primary);border-radius:99px;padding:6px 14px}
.paynote{font-size:13px;color:var(--ink);background:var(--note);border-radius:10px;padding:8px 12px;margin:0 auto 10px;max-width:320px}
.demo{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.demo span{background:rgba(51,84,122,.9);color:#fff;font-weight:700;padding:4px 14px;border-radius:8px;transform:rotate(-12deg);font-size:15px}
.acct{font-size:14px;color:var(--muted)}
pre{white-space:pre-wrap;background:var(--cream);border-radius:12px;padding:12px;font:inherit;font-size:13px;text-align:left;margin:12px 0}
.howto{text-align:left;font-size:14px;background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:6px}
.howto ol{padding-left:20px}
.howto li{margin:3px 0}
.slip{margin:16px 0 4px;border:2px dashed var(--primary-2);background:#fbfcfd;border-radius:16px;padding:14px;text-align:center}
.sliphead{font-weight:600;margin-bottom:10px}
.slippick{display:block;background:var(--soft);border-radius:12px;padding:12px;font-weight:600;color:var(--primary);cursor:pointer;margin:0 0 10px}
#slipPrev[hidden]{display:none}
#slipPrev{max-width:180px;max-height:240px;border-radius:10px;margin:0 auto 10px;display:block;border:1px solid var(--line)}
.slipdone{background:var(--matcha-soft);color:var(--matcha-dk);border-radius:12px;padding:14px;line-height:1.7}
details.sum{margin-top:12px;text-align:left}
details.sum summary{cursor:pointer;font-size:14px;color:var(--muted)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;z-index:30;padding:20px;overflow-y:auto;text-align:center}
.zoom.open{display:block}
.zoom img{max-width:100%;max-height:88vh;border-radius:12px;margin:0 auto 14px;display:block}
.zoom .x{position:fixed;top:12px;right:16px;color:#fff;font-size:28px}
.more{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.thumb{position:relative}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:40}

/* ===== ธีมสดใส (ให้เข้ากับรูป QR) ===== */
body{background:linear-gradient(180deg,#eaf7fd 0%,#f4fbf0 60%,#eef8e1 100%) fixed;color:var(--ink)}
header{background:linear-gradient(170deg,#7fd0f2 0%,#b7e6f8 55%,#dff3c6 100%);color:var(--primary);padding:30px 16px 34px;border-radius:0 0 28px 28px;box-shadow:0 6px 0 #c8e9a0}
header::after{display:none}
header h1{position:relative;z-index:1;font-size:30px;font-weight:700;color:var(--primary);text-shadow:0 3px 0 #fff;letter-spacing:.2px}
header h1 .x{color:#5aa832}
header p{position:relative;z-index:1;display:inline-block;opacity:1;margin-top:8px;background:#fff;color:#3a8a3f;font-weight:600;font-size:14px;padding:4px 16px;border-radius:99px;box-shadow:0 3px 0 var(--matcha)}
.ig{position:relative;z-index:1;display:table;margin:12px auto 0;background:rgba(255,255,255,.75);color:var(--primary);font-weight:500}
.deco{position:absolute;pointer-events:none}
.deco.cup{width:62px;left:8px;top:112px}
.deco.cookie{width:46px;right:12px;top:108px;transform:rotate(12deg)}
.deco.leaf{width:30px;right:52px;bottom:14px;transform:rotate(140deg)}
.deco.s1{width:20px;left:26px;top:20px}
.deco.s2{width:22px;right:20px;top:16px}
.deco.s3{width:16px;left:84px;bottom:18px}
@media (max-width:360px){header h1{font-size:25px}.deco.cup{width:50px}.deco.cookie{width:38px}}
.tabs button{border:2px solid var(--primary-2);color:var(--primary);font-weight:500}
.tabs button.on{background:var(--primary-2);color:#fff;box-shadow:0 3px 0 #2f8fbf}
.promo-banner{background:#fff;color:var(--matcha-dk);border:2px dashed var(--matcha);font-weight:600}
.card{border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line)}
.thumb{background:var(--sky-soft);border-radius:16px}
.price{color:var(--primary)}
.tag{background:var(--matcha-soft);color:var(--matcha-dk)}
.qty button{border:2px solid var(--primary-2);color:var(--primary-2)}
.qty button.plus{background:var(--primary-2);color:#fff;box-shadow:0 3px 0 #2f8fbf}
.qty button:disabled{box-shadow:none}
.bar{border-top:2px solid var(--line)}
.btn{background:var(--coral);border-radius:16px;box-shadow:0 5px 0 var(--coral-dk);font-weight:700}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 var(--coral-dk)}
.btn:disabled{background:var(--off);box-shadow:0 5px 0 #aebfcc}
.btn.ghost{background:#fff;color:var(--primary);border:2px solid var(--primary-2);box-shadow:0 4px 0 var(--line)}
.panel{border-radius:26px 26px 0 0;background:#fff}
.steps div.on{color:var(--primary-2);border-color:var(--primary-2)}
.steps div.done{border-color:var(--matcha)}
.opt{border-radius:18px}
.opt.on{border-color:var(--primary-2);background:var(--sky-soft)}
.opt input{accent-color:var(--primary-2)}
input:focus,textarea:focus{border-color:var(--primary-2)}
.pay .amount{color:var(--coral-dk)}
.qrbox{border:3px dashed #b7e07a;border-radius:24px}
.savebtn{color:var(--primary);border:2px solid var(--primary-2)}
.slip{border:3px dashed var(--primary-2);background:#f7fcff;border-radius:22px}
.slippick{background:var(--sky-soft);color:var(--primary)}
.slipdone{background:var(--matcha-soft);color:var(--matcha-dk)}
.line.disc{color:var(--matcha-dk)}
.stock{color:#d9822b}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const baht = n => "฿" + n.toLocaleString("th-TH");
const cart = {};            // code -> qty

/* ---------- คำนวณ ---------- */
function cartLines(){
  return PRODUCTS.filter(p => cart[p.code]).map(p => ({ p, qty: cart[p.code], sub: cart[p.code]*p.price }));
}
function itemsFull(){ return cartLines().reduce((a,l)=>a+l.sub,0); }
function discount(){
  let d = 0;
  for (const [key, pr] of Object.entries(PROMOS)){
    const lines = cartLines().filter(l => l.p.promo === key);
    const n = lines.reduce((a,l)=>a+l.qty,0);
    if (n >= pr.qty){
      const unitPrice = lines[0].p.price;
      const sets = Math.floor(n / pr.qty);
      d += sets * (pr.qty*unitPrice - pr.price);
    }
  }
  return d;
}
function itemsTotal(){ return itemsFull() - discount(); }
function itemsCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function totalWeight(){ return cartLines().reduce((a,l)=>a+l.qty*l.p.weight,0); }
function shippingTier(w){ return SHIPPING.find(t => w <= t.maxG) || null; }

/* ---------- หน้าร้าน ---------- */
function renderTabs(){
  const cats = ["ทั้งหมด", ...new Set(PRODUCTS.map(p=>p.cat))];
  $("#tabs").innerHTML = cats.map(c=>`<button class="${c===activeCat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{activeCat=b.dataset.c;renderTabs();renderList();});
}
function thumb(p){
  const fallback = `<span>${p.emoji}</span>`;
  return p.img
    ? `<div class="thumb" data-code="${p.code}"><img src="${esc(encodeURI(p.img))}" alt="${esc(p.th)}" loading="lazy" onerror="this.parentNode.removeAttribute('data-code');this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${p.emoji}'}))">${p.more&&p.more.length?`<span class="more">+${p.more.length}</span>`:""}</div>`
    : `<div class="thumb">${fallback}</div>`;
}
let STOCK = null;   // {code:{left,status}} จาก Google Sheet · null = ไม่เช็กสต็อก
function leftOf(code){ return STOCK ? (STOCK[code] ? STOCK[code].left : 0) : Infinity; }
async function loadStock(){
  if(!CONFIG.sheetsUrl) return;
  try{
    const r = await fetch(CONFIG.sheetsUrl, {cache:"no-store"});
    const d = await r.json();
    if(d.ok){ STOCK = d.stock; clampCart(); renderList(); renderBar(); }
  }catch(e){ console.warn("โหลดสต็อกไม่ได้", e); }
}
function clampCart(){
  let changed = false;
  for(const k in cart){ const l = leftOf(k); if(cart[k] > l){ changed = true; if(l<=0) delete cart[k]; else cart[k] = l; } }
  return changed;
}
function stockLabel(p){
  if(!STOCK) return "";
  const s = STOCK[p.code] || {left:0,status:"หมด"};
  if(s.left <= 0) return `<span class="stock out">หมดชั่วคราว</span>`;
  if(CONFIG.showStockCount || s.status === "ใกล้หมด") return `<span class="stock">เหลือ ${s.left} ชิ้น</span>`;
  return "";
}
function renderList(){
  const items = PRODUCTS.filter(p=>activeCat==="ทั้งหมด"||p.cat===activeCat);
  const showPromo = items.some(p=>p.promo);
  $("#list").innerHTML =
    (showPromo ? Object.values(PROMOS).map(pr=>`<div class="promo-banner">🔥 โปร: ${esc(pr.label)}</div>`).join("") : "") +
    items.map(p=>{
      const q = cart[p.code]||0, left = leftOf(p.code), out = left<=0;
      return `<div class="card ${out?'out':''}">
        ${thumb(p)}
        <div class="info">
          <div class="brand">${esc(p.brand)}</div>
          <h3>${esc(p.th)}</h3>
          <div class="cn">${esc(p.cn)}</div>
          <div class="unit">${esc(p.unit)}</div>
          ${stockLabel(p)}
          ${p.promo?`<span class="tag">${PROMOS[p.promo].qty} ถุง ${baht(PROMOS[p.promo].price)} คละรสได้</span>`:""}
          <div class="bottom">
            <span class="price">${baht(p.price)}</span>
            <div class="qty">
              ${q?`<button data-k="${p.code}" data-d="-1" aria-label="ลด">−</button><span>${q}</span>`:""}
              <button class="plus" data-k="${p.code}" data-d="1" aria-label="เพิ่ม" ${q>=left?"disabled":""}>+</button>
            </div>
          </div>
        </div>
      </div>`;
    }).join("");
  $("#list").querySelectorAll(".qty button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, n=Math.min((cart[k]||0)+Number(b.dataset.d), leftOf(k));
    if(n<=0) delete cart[k]; else cart[k]=n;
    renderList(); renderBar();
  });
  $("#list").querySelectorAll(".thumb[data-code]").forEach(t=>t.onclick=()=>{
    const p = PRODUCTS.find(x=>x.code===t.dataset.code);
    $("#zoom").innerHTML = `<span class="x">✕</span>` + [p.img, ...(p.more||[])].map(s=>`<img src="${esc(encodeURI(s))}" alt="${esc(p.th)}">`).join("");
    $("#zoom").classList.add("open");
  });
}
function renderBar(){
  $("#barTotal").textContent = baht(itemsTotal());
  const n = itemsCount();
  $("#checkoutBtn").disabled = n===0;
  $("#checkoutBtn").textContent = n ? `สั่งเลย (${n}) →` : "สั่งเลย →";
}

/* ---------- Checkout ---------- */
function stepsBar(i){
  const names=["1 ค่าส่ง","2 ที่อยู่","3 ชำระเงิน"];
  return `<div class="steps">${names.map((n,k)=>`<div class="${k===i?'on':k<i?'done':''}">${n}</div>`).join("")}</div>`;
}
function itemsSummaryHtml(){
  const d = discount();
  return cartLines().map(l=>`<div class="line"><span>${esc(l.p.th)} × ${l.qty}</span><span>${baht(l.sub)}</span></div>`).join("")
    + (d?`<div class="line disc"><span>ส่วนลดโปร KKBear</span><span>−${baht(d)}</span></div>`:"")
    + `<div class="line" style="font-weight:600"><span>รวมค่าสินค้า</span><span>${baht(itemsTotal())}</span></div>`;
}

function step1(){
  const w = totalWeight(), tier = shippingTier(w);
  if(!order.method) order.method = "reg";
  let body;
  if(!tier){
    body = `<div class="warn">📦 น้ำหนักรวมเกิน 2 กก. ค่าส่งต้องคำนวณพิเศษ<br>กรุณาทักร้านทาง IG เพื่อสอบถามค่าส่งค่ะ</div>
      <div class="actions">
        <button class="btn full" id="askBtn">📩 ทักร้านทาง IG</button>
        <button class="btn ghost full" id="backBtn">← กลับไปแก้ตะกร้า</button>
      </div>`;
  } else {
    body = `<h2 style="font-size:16px;margin-top:14px">เลือกวิธีจัดส่ง</h2>
      ${[["reg","ลงทะเบียน","ประหยัด · ประมาณ 3–5 วัน"],["ems","EMS","ด่วน · ประมาณ 1–2 วัน"]].map(([k,n,s])=>`
        <label class="opt ${order.method===k?'on':''}">
          <input type="radio" name="m" value="${k}" ${order.method===k?'checked':''}>
          <span class="t"><b>${n}</b><small>${s}</small></span>
          <span class="p">${baht(tier[k])}</span>
        </label>`).join("")}
      <div class="line total"><span>รวมทั้งหมด</span><span id="grand"></span></div>
      <div class="actions">
        <button class="btn full" id="nextBtn">ถัดไป: กรอกที่อยู่ →</button>
        <button class="btn ghost full" id="backBtn">← กลับไปเลือกสินค้าเพิ่ม</button>
      </div>`;
  }
  $("#panel").innerHTML = stepsBar(0) + `<h2>🧾 สรุปตะกร้า</h2>` + itemsSummaryHtml()
    + body;

  $("#backBtn").onclick = closeSheet;
  if(!tier){
    $("#askBtn").onclick = ()=>{
      const msg = "สวัสดีค่ะ อยากสั่ง:\n" + cartLines().map(l=>`• ${l.p.th} × ${l.qty}`).join("\n") + `\nน้ำหนักรวม ~${w} g รบกวนแจ้งค่าส่งค่ะ`;
      copy(msg); toast("คัดลอกรายการแล้ว ✓ ไปวางในแชทได้เลย");
      setTimeout(()=>location.href="https://ig.me/m/"+CONFIG.igUsername,700);
    };
    return;
  }
  const upd = ()=>{
    order.ship = tier[order.method];
    $("#grand").textContent = baht(itemsTotal() + order.ship);
    $("#panel").querySelectorAll(".opt").forEach(o=>o.classList.toggle("on", o.querySelector("input").checked));
  };
  $("#panel").querySelectorAll("input[name=m]").forEach(r=>r.onchange=()=>{order.method=r.value;upd();});
  upd();
  $("#nextBtn").onclick = step2;
}

function step2(){
  const c = order.customer || {};
  $("#panel").innerHTML = stepsBar(1) + `<h2>📦 ข้อมูลจัดส่ง</h2>
    <form id="f">
      <label>ชื่อ-นามสกุลผู้รับ *</label><input type="text" name="name" required value="${esc(c.name||"")}">
      <div class="row2">
        <div><label>เบอร์โทร *</label><input type="tel" name="phone" required pattern="[0-9\\-\\s]{9,12}" value="${esc(c.phone||"")}"></div>
        <div><label>IG ของคุณ</label><input type="text" name="ig" placeholder="@username" value="${esc(c.ig||"")}"></div>
      </div>
      <label>ที่อยู่จัดส่ง *</label><textarea name="address" rows="3" required placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ จังหวัด รหัสไปรษณีย์">${esc(c.address||"")}</textarea>
      <label>หมายเหตุ</label><input type="text" name="note" placeholder="เช่น ฝากไว้ที่ป้อมยาม" value="${esc(c.note||"")}">
      <div class="line total"><span>ยอดชำระ (${order.method==="ems"?"EMS":"ลงทะเบียน"})</span><span>${baht(itemsTotal()+order.ship)}</span></div>
      <div class="actions">
        <button class="btn full" type="submit">ไปหน้าชำระเงิน →</button>
        <button class="btn ghost full" type="button" id="backBtn">← กลับ</button>
      </div>
    </form>`;
  $("#backBtn").onclick = ()=>{ order.customer = Object.fromEntries(new FormData($("#f"))); step1(); };
  $("#f").onsubmit = async e=>{
    e.preventDefault();
    order.customer = Object.fromEntries(new FormData(e.target));
    const btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "กำลังตรวจสต็อก…";
    const res = await placeOrder();
    if(res.ok){ step3(); return; }
    btn.disabled = false; btn.textContent = "ไปหน้าชำระเงิน →";
    if(res.reason === "stock"){
      STOCK = res.stock || STOCK;
      const names = res.short.map(s=>{ const p=PRODUCTS.find(x=>x.code===s.code); return `• ${p?p.th:s.code} (เหลือ ${s.left})`; }).join("<br>");
      clampCart(); renderList(); renderBar();
      $("#panel").innerHTML = stepsBar(0) + `<h2>😢 ของไม่พอ</h2>
        <div class="warn">ขออภัยค่ะ สินค้านี้เพิ่งถูกสั่งไป จำนวนเหลือไม่พอ:<br>${names}<br><br>ตะกร้าถูกปรับให้ตามจำนวนที่มีแล้ว</div>
        <div class="actions"><button class="btn full" id="okBtn">กลับไปดูตะกร้า</button></div>`;
      $("#okBtn").onclick = ()=>{ closeSheet(); };
    } else {
      toast("ส่งออเดอร์ไม่สำเร็จ ลองใหม่อีกครั้ง หรือทักร้านทาง IG ค่ะ");
    }
  };
}

function step3(){
  const c = order.customer;
  if(!order.id) order.id = "CF" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  const total = itemsTotal() + order.ship;
  const methodName = order.method==="ems" ? "EMS" : "ลงทะเบียน";
  const d = discount();
  const summary =
`🛒 ออเดอร์ ${order.id}
${cartLines().map(l=>`• ${l.p.code} ${l.p.th} × ${l.qty}`).join("\n")}${d?`\nส่วนลดโปร: −${baht(d)}`:""}
ค่าส่ง ${methodName}: ${baht(order.ship)}
💰 ยอดโอน ${baht(total)}

👤 ${c.name} | ${c.phone}${c.ig?" | "+c.ig:""}
📦 ${c.address}${c.note?"\n📝 "+c.note:""}`;

  order.summary = summary; order.total = total;
  $("#panel").innerHTML = stepsBar(2) + `<div class="pay">
    <h2>💳 สแกนจ่ายเงิน</h2>
    <div class="acct">ยอดที่ต้องโอน</div>
    <div class="amount">${baht(total)}</div>
    <div class="qrbox" id="qrbox"></div>
    <div class="acct">พร้อมเพย์ · ${esc(CONFIG.bankName)} · ${esc(CONFIG.accountName)}</div>
    <div class="slip" id="slipBox"></div>
    <details class="sum"><summary>ดูสรุปออเดอร์ ${esc(order.id)}</summary><pre>${esc(summary)}</pre></details>
    <div class="actions">
      <button class="btn ghost full" id="dmBtn">💬 สอบถามร้านทาง IG</button>
      ${order.placed?"":`<button class="btn ghost full" id="backBtn">← แก้ไขข้อมูล</button>`}
    </div>
    ${order.placed?`<p class="note" style="margin-top:10px">ต้องการแก้ที่อยู่/รายการ ทักร้านทาง IG ได้เลยค่ะ</p>`:""}
    </div>`;
  renderQr(total);
  renderSlip();
  if($("#backBtn")) $("#backBtn").onclick = step2;
  $("#dmBtn").onclick = ()=>{
    copy(summary); toast("คัดลอกออเดอร์แล้ว ✓ วางในแชทได้เลย");
    setTimeout(()=>location.href="https://ig.me/m/"+CONFIG.igUsername,800);
  };
}

  };
}
function shrinkImage(file, maxSide, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("toBlob")), "image/jpeg", quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("load")); };
    img.src = url;
  });
}
async function sendSlip(blob){
  if(!CONFIG.sheetsUrl) return {ok:true};   // โหมดทดลอง
  const data = await new Promise(r=>{ const fr = new FileReader(); fr.onload = ()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
  try{
    const r = await fetch(CONFIG.sheetsUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action:"slip", id:order.id, mime:"image/jpeg", data})});
    return await r.json();
  }catch(err){ console.warn(err); return {ok:false, reason:"network"}; }
}

/* ---------- QR พร้อมเพย์ใส่ยอดเงิน ---------- */
function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++) c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF; } return c.toString(16).toUpperCase().padStart(4,"0"); }
function tlv(id,v){ return id + String(v.length).padStart(2,"0") + v; }
function promptpayPayload(id, amount){
  const d = id.replace(/\D/g,"");
  const target = d.length===10 ? tlv("01","0066"+d.slice(1)) : tlv("02", d);   // เบอร์มือถือ หรือ เลขบัตรปชช.
  const p = tlv("00","01") + tlv("01","12") + tlv("29", tlv("00","A000000677010111") + target)
          + tlv("53","764") + tlv("54", amount.toFixed(2)) + tlv("58","TH") + "6304";
  return p + crc16(p);
}
function qrCanvas(text, px){
  const q = qrcode(0,"M"); q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 3, cell = Math.floor(px/(n+quiet*2));
  const size = cell*(n+quiet*2), c = document.createElement("canvas");
  c.width = c.height = size; const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0,0,size,size); g.fillStyle = "#000";
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect((k+quiet)*cell,(r+quiet)*cell,cell,cell);
  return c;
}
function payCard(total){
  // รูปสำหรับบันทึก: QR + ชื่อบัญชี + ยอดเงิน
  const qr = qrCanvas(promptpayPayload(CONFIG.promptpayId, total), 600);
  const W = 720, H = 1000, c = document.createElement("canvas"); c.width=W; c.height=H;
  const g = c.getContext("2d"); const font = "Prompt, system-ui, sans-serif";
  g.fillStyle="#4fb3e0"; g.fillRect(0,0,W,H);
  g.fillStyle="#fff"; g.fillRect(30,30,W-60,H-60);
  g.fillStyle="#1f4f7d"; g.fillRect(30,30,W-60,110);
  g.fillStyle="#fff"; g.textAlign="center"; g.font=`600 44px ${font}`; g.fillText("PromptPay พร้อมเพย์", W/2, 102);
  g.drawImage(qr, (W-qr.width)/2, 165);
  g.fillStyle="#2a3340"; g.font=`600 30px ${font}`; g.fillText(CONFIG.accountName, W/2, 815);
  g.fillStyle="#6d7682"; g.font=`26px ${font}`; g.fillText(CONFIG.bankName + " · Chifanlema", W/2, 857);
  g.fillStyle="#e0623d"; g.font=`700 54px ${font}`; g.fillText("฿" + total.toLocaleString("th-TH",{minimumFractionDigits:2}), W/2, 930);
  return c.toDataURL("image/png");
}
function renderQr(total){
  const box = $("#qrbox");
  if(CONFIG.promptpayId && window.qrcode){

    box.classList.add("real");

    box.innerHTML = `<img src="${DEMO_QR}" alt="QR ตัวอย่าง"><div class="demo"><span>ตัวอย่าง · ห้ามโอน</span></div>`;

}

async function placeOrder(){
  if(!order.id) order.id = "CF" + new Date().toISOString().slice(2,10).replace(/-/g,"") + "-" + Math.random().toString(36).slice(2,6).toUpperCase();
  if(!CONFIG.sheetsUrl) return {ok:true};          // โหมดทดลอง
  if(order.placed) return {ok:true};               // กันส่งซ้ำ
  const c = order.customer;
  try{
    const r = await fetch(CONFIG.sheetsUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        action:"order", id:order.id, name:c.name, phone:c.phone, ig:c.ig||"", address:c.address, note:c.note||"",
        items: cartLines().map(l=>({code:l.p.code, qty:l.qty})),
        discount: discount(), shipMethod: order.method==="ems"?"EMS":"ลงทะเบียน", shipFee: order.ship,
        total: itemsTotal()+order.ship
      })});
    const d = await r.json();
    if(d.ok){ order.placed = true; loadStock(); }
    return d;
  }catch(err){ console.warn(err); return {ok:false, reason:"network"}; }
}

function openCheckout(){ order = { customer: order.customer }; step1(); $("#sheet").classList.add("open"); }
function resetAfterOrder(){ for(const k in cart) delete cart[k]; order = { customer: order.customer }; renderList(); renderBar(); }
function closeSheet(){ $("#sheet").classList.remove("open"); if(order.placed) resetAfterOrder(); }
function copy(t){
  const fallback = ()=>{ const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(e){} a.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(fallback); else fallback();
}
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2400); }

$("#checkoutBtn").onclick = openCheckout;
$("#sheet").onclick = e=>{ if(e.target.id==="sheet") closeSheet(); };
$("#zoom").onclick = ()=>$("#zoom").classList.remove("open");
renderTabs(); renderList(); renderBar(); loadStock();
</script>

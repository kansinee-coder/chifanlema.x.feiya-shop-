<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7fd0f2">
<title>หลังบ้าน — Chifanlema.x.Feiya</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1f4f7d; --sky:#4fb3e0; --sky-dk:#2f8fbf; --sky-soft:#e3f4fc; --matcha:#8cc63f; --matcha-dk:#4f8f2a; --matcha-soft:#eaf6d8;
  --coral:#ff8a65; --coral-dk:#e0623d; --red:#d9534f; --red-soft:#fdeaea; --amber:#c98a12; --amber-soft:#fff4dc;
  --ink:#1f3550; --muted:#5f7286; --line:#d6ecf7; --off:#c7d6e0; --card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Prompt',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eaf7fd 0%,#f4fbf0 60%,#eef8e1 100%) fixed;min-height:100vh;padding-bottom:60px;font-size:15px}
button{font:inherit;cursor:pointer;color:inherit}
header{background:linear-gradient(170deg,#7fd0f2 0%,#b7e6f8 55%,#dff3c6 100%);padding:18px 16px 20px;text-align:center;border-radius:0 0 26px 26px;box-shadow:0 5px 0 #c8e9a0}
header h1{font-size:21px;font-weight:700;color:var(--primary);text-shadow:0 2px 0 #fff}
header h1 .x{color:#5aa832}
header p{display:inline-block;margin-top:5px;background:#fff;color:#3a8a3f;font-weight:600;font-size:13px;padding:2px 14px;border-radius:99px;box-shadow:0 3px 0 var(--matcha)}
main{max-width:620px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:14px;margin-bottom:14px}
h2{font-size:16px;color:var(--primary);margin-bottom:8px}
h3{font-size:14px;color:var(--primary);margin:14px 0 4px}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.hide{display:none!important}
.demo{background:#fff4e3;border:1px solid #ecd9ad;border-radius:12px;padding:10px;font-size:13px;margin-bottom:12px}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:2px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:108px}
.tile:active{transform:translateY(2px);box-shadow:0 3px 0 var(--line)}
.tile .ic{font-size:26px;line-height:1}
.tile b{font-size:15.5px;color:var(--primary)}
.tile small{font-size:12px;color:var(--muted);line-height:1.4}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;margin:2px 4px 0 0}
.p-red{background:var(--red-soft);color:var(--red)} .p-amber{background:var(--amber-soft);color:var(--amber)} .p-green{background:var(--matcha-soft);color:var(--matcha-dk)} .p-sky{background:var(--sky-soft);color:var(--primary)} .p-grey{background:#eef2f5;color:var(--muted)}

/* top bar + tabs */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar .back{border:2px solid var(--sky);background:#fff;color:var(--primary);border-radius:12px;padding:5px 12px;font-weight:600}
.bar h2{margin:0;font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--sky-soft);border-radius:16px;padding:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;font-weight:600;font-size:13.5px;padding:9px 9px;border-radius:12px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--primary);color:#fff;box-shadow:0 3px 0 #133656}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;margin-left:4px}

/* lists */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row .t{font-weight:600;font-size:14.5px}
.row .d{color:var(--muted);font-size:12.5px;line-height:1.45}
.row .a{font-weight:700;white-space:nowrap;text-align:right}
.a.in{color:var(--matcha-dk)} .a.out{color:var(--red)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:16px 6px}
.month{border:2px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;background:#fff}
.month>button{width:100%;border:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;text-align:left;gap:10px}
.month>button .t{font-weight:600}
.month>button .d{font-size:12.5px;color:var(--muted)}
.month .body{padding:0 14px 8px;border-top:1px dashed var(--line);background:#fcfeff}
.chev{color:var(--muted);transition:transform .2s;display:inline-block}
.open .chev{transform:rotate(90deg)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border-radius:14px;padding:9px 4px}
.stats small{display:block;font-size:11.5px;color:var(--muted)}
.stats b{display:block;font-size:16px}
.s-in{background:var(--matcha-soft)} .s-in b{color:var(--matcha-dk)}
.s-out{background:var(--red-soft)} .s-out b{color:var(--red)}
.s-pro{background:var(--sky-soft)} .s-pro b{color:var(--primary)}
.neg b{color:var(--red)!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv span{color:var(--muted)} .kv b{text-align:right;font-weight:600}
table.items{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
table.items td{padding:5px 2px;border-bottom:1px dashed var(--line);vertical-align:top}
table.items td:last-child{text-align:right;white-space:nowrap}

/* forms */
label{display:block;font-size:13.5px;font-weight:600;margin:12px 0 5px}
label .opt{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=date],input[type=number],input[type=password],input[type=tel],input[type=search],select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:2px solid var(--line);border-radius:12px;background:#fdfcf9;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky)}
input[readonly]{background:#f1f6f9;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g2 label,.g3 label{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);background:#fff;font-size:13.5px;padding:5px 12px;border-radius:99px}
.chip.on{background:var(--sky);border-color:var(--sky);color:#fff;font-weight:600}
.btn{display:block;width:100%;margin-top:16px;background:var(--coral);color:#fff;border:0;border-radius:16px;padding:13px;font-weight:700;font-size:17px;box-shadow:0 5px 0 var(--coral-dk)}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 var(--coral-dk)}
.btn:disabled{background:var(--off);box-shadow:0 5px 0 #aebfcc;cursor:not-allowed}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--sky-dk)}
.btn.green{background:var(--matcha-dk);box-shadow:0 5px 0 #3a6c1e}
.btn.ghost{background:#fff;color:var(--primary);border:2px solid var(--sky);box-shadow:0 4px 0 var(--line);font-size:15px;padding:10px}
.btn.danger{background:#fff;color:var(--red);border:2px solid var(--red-soft);box-shadow:none;font-size:14px;padding:9px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns .btn{margin-top:10px;font-size:15px;padding:11px}
.mini{border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--primary);white-space:nowrap}
.mini.go{background:var(--matcha-dk);border-color:var(--matcha-dk);color:#fff}
.mini.no{color:var(--red);border-color:var(--red-soft)}
.search{margin-bottom:10px}
.itemrow{border:2px solid var(--line);border-radius:14px;padding:8px 10px 10px;margin-bottom:8px;background:#fcfeff}
.itemrow .top{display:flex;gap:8px;align-items:center}
.itemrow .top select{flex:1}
.itemrow .x{border:0;background:var(--red-soft);color:var(--red);border-radius:10px;width:36px;height:36px;font-size:16px;flex:none}
.total{background:var(--sky-soft);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.7}
.total b.big{font-size:20px;color:var(--primary)}
.warn{background:var(--red-soft);color:#9b2f2c;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;line-height:1.6}
.ok{background:var(--matcha-soft);color:#2f5f18;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;line-height:1.7}
.hint{background:var(--amber-soft);color:#7a5408;border-radius:12px;padding:8px 12px;font-size:12.5px;margin-top:8px;line-height:1.55}
.amt{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:4px 12px;background:#fdfcf9}
.amt:focus-within{border-color:var(--sky)}
.amt span{font-size:22px;font-weight:700;color:var(--muted)}
.amt input{border:0!important;background:transparent!important;padding:5px 0!important;font-size:24px!important;font-weight:700}
.pick{display:block;text-align:center;background:var(--sky-soft);color:var(--primary);font-weight:600;border-radius:14px;padding:11px;cursor:pointer;border:2px dashed var(--sky);margin:0}
.prev{display:block;max-width:150px;max-height:190px;border-radius:12px;margin:10px auto 0;border:1px solid var(--line)}

/* track */
.track{display:flex;gap:6px;margin-top:8px}
.track input{flex:1;font-size:15px;padding:7px 10px}

/* bottom sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .bg{position:absolute;inset:0;background:rgba(20,40,60,.45)}
.sheet .box{position:relative;background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:0 16px 30px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;border-bottom:2px solid var(--line);margin-bottom:8px;z-index:2}
.sheet .head b{font-size:16.5px;color:var(--primary)}
.sheet .head button{border:0;background:var(--sky-soft);border-radius:10px;width:34px;height:34px;font-size:16px}
.slipimg{display:block;max-width:100%;border-radius:12px;margin:8px auto}

/* pin + misc */
.pin{text-align:center;max-width:380px;margin:20px auto}
.pin input{text-align:center;font-size:28px;letter-spacing:10px;max-width:220px;margin:12px auto 0;display:block}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:90vw;text-align:center}
.busy{position:fixed;inset:0;z-index:50;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600;color:var(--primary)}
.busy.on{display:flex}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--sky-soft);border-top-color:var(--sky);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;margin-top:18px}
.foot button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.code{font-weight:700;color:var(--primary)}
.right{text-align:right}
.mt{margin-top:10px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px}
.sec h2{margin:0}
@media (max-width:380px){ .tiles{gap:9px} .tile{padding:12px 10px} .g3{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header>
  <h1>Chifanlema<span class="x">.x.</span>Feiya</h1>
  <p>หลังบ้าน</p>
</header>
<main id="main"></main>
<div class="sheet hide" id="sheet"><div class="bg" data-act="closeSheet"></div><div class="box"><div class="head"><b id="sheetTitle"></b><button data-act="closeSheet" aria-label="ปิด">✕</button></div><div id="sheetBody"></div></div></div>
<div class="busy" id="busy"><div class="spin"></div><div id="busyText">กำลังโหลด…</div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================
   CONFIG — วางลิงก์ /exec ของ Apps Script "ไฟล์ Chifanlema-บัญชี"
   ===================================================== */
const CONFIG = {
  adminUrl: "https://script.google.com/macros/s/AKfycbxU-_1cyp8r3TXVvMSB98Iy0bq102GJ8Ri5N4uAge8bX_Q50oC30PJFb6y0NOKufWs/exec",
};
/* ===================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n)||0)*100)/100;
const baht = n => (n<0?"−":"") + "฿" + Math.abs(r2(n)).toLocaleString("th-TH",{maximumFractionDigits:2});
const fmt = n => n==null || !isFinite(n) ? "–" : baht(n);
const num = s => Number(String(s ?? "").replace(/,/g,"")) || 0;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const DEMO = !CONFIG.adminUrl;
const TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const TH_ML = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const dTH = ymd => { if(!ymd) return "–"; const [y,m,d] = ymd.split("-").map(Number); return `${d} ${TH_M[m-1]} ${String(y+543).slice(2)}`; };
const mTH = ym => { const [y,m] = ym.split("-").map(Number); return `${TH_ML[m-1]} ${y+543}`; };
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const base = lc => { const s=String(lc); const i=s.lastIndexOf("-"); return i>0 ? s.slice(0,i) : s; };

let PIN = store.get("adminPin") || "";
let DATA = null;
const UI = { open:{}, q:{}, filter:{} };

/* ---------------- API ---------------- */
async function api(action, body={}, label){
  busy(true, label);
  try{
    if(DEMO){ await new Promise(r=>setTimeout(r,250)); return demoApi(action, JSON.parse(JSON.stringify(body))); }
    const r = await fetch(CONFIG.adminUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body, action, pin:PIN})});
    return await r.json();
  }catch(e){ return {ok:false, reason:"network"}; }
  finally{ busy(false); }
}
const ERR = { network:"เชื่อมต่อไม่ได้ ลองใหม่อีกครั้งค่ะ", notfound:"ไม่พบรายการนี้ (อาจมีคนแก้ในชีทไปแล้ว) ลองโหลดใหม่ค่ะ", input:"กรอกข้อมูลให้ครบก่อนนะคะ",
  rate:"กรุณาใส่เรทหยวน", exists:"มีข้อมูลนี้อยู่แล้ว", inuse:"เปลี่ยนวันที่ไม่ได้ เพราะมีล็อตสินค้าใช้เรทวันนี้อยู่ (แก้ได้แค่ตัวเลขเรท)",
  items:"ใส่สินค้าอย่างน้อย 1 รายการ", amount:"ใส่จำนวนเงิน", category:"เลือกหมวด", newproduct:"ใส่ชื่อสินค้าใหม่", noslip:"ออเดอร์นี้ไม่มีสลิป" };
async function act(action, body, okMsg, label){
  const r = await api(action, body, label || "กำลังบันทึก…");
  if(r.ok){ if(r.data) DATA = r.data; if(okMsg) toast(okMsg); return r; }
  if(r.reason==="pin"){ store.del("adminPin"); PIN=""; closeSheet(); showPin("รหัสไม่ถูกต้อง"); return r; }
  if(r.reason==="locked"){ closeSheet(); showPin(`ใส่รหัสผิดหลายครั้ง ลองใหม่ใน ${r.minutes} นาที`); return r; }
  if(r.reason!=="stock") toast(ERR[r.reason] || ("บันทึกไม่สำเร็จ: " + (r.message || r.reason)));
  return r;
}

/* ---------------- PIN ---------------- */
function showPin(msg){
  $("#main").innerHTML = `${DEMO?`<div class="demo">โหมดทดลอง: ยังไม่ได้ใส่ลิงก์ Apps Script ข้อมูลเป็นตัวอย่าง ไม่บันทึกจริง (PIN ทดลอง = 2580)</div>`:""}
  <section class="card pin"><h2>🔒 ใส่รหัส PIN</h2><p class="note">ใส่ครั้งเดียว เครื่องนี้จะจำไว้</p>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
  <div class="err">${esc(msg||"")}</div><button class="btn" data-act="login">เข้าใช้งาน</button></section>`;
  setTimeout(()=>{ const i=$("#pinInput"); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==="Enter") H.login(); }; } }, 50);
}
async function boot(){
  const r = await api("boot", {}, "กำลังโหลดข้อมูลร้าน…");
  if(!r.ok){
    if(r.reason==="pin"){ store.del("adminPin"); PIN=""; showPin(PIN?"รหัสไม่ถูกต้อง":"รหัสไม่ถูกต้อง"); }
    else if(r.reason==="locked") showPin(`ใส่รหัสผิดหลายครั้ง ลองใหม่ใน ${r.minutes} นาที`);
    else showPin(ERR[r.reason] || ("โหลดไม่สำเร็จ: " + (r.message||r.reason)));
    return false;
  }
  DATA = r.data; store.set("adminPin", PIN); render(); return true;
}

/* ---------------- ข้อมูลที่คำนวณ ---------------- */
const isPaid = o => DATA.paid.includes(o.status);
const liveItems = o => o.items.filter(i=>i.status!=="ยกเลิก");
const orderSub = o => r2(liveItems(o).reduce((a,i)=>a+i.sub,0));
const orderTotal = o => r2(orderSub(o) - o.discount + o.shipFee);
const needsShip = o => (o.status==="ชำระแล้ว"||o.status==="ชำระเงินแล้ว") && !o.tracking && o.shipMethod && o.shipMethod!=="นัดรับ";
const stockOf = code => DATA.stock.find(s=>s.code.toUpperCase()===String(code).toUpperCase());
const prodName = code => { const s=stockOf(code); if(s) return s.th; const p=DATA.products.find(x=>x.code===code); return p ? (p.th||p.cn) : code; };
const lotOf = lotCode => DATA.cost.lots.find(l=>l.lotCode===lotCode);
const sortDesc = (a,b,k="date") => String(b[k]).localeCompare(String(a[k]));

function unitCost(code, date){
  if(String(code).includes("+")){
    const cs = code.split("+").map(c=>unitCost(c.trim(), date));
    return cs.every(c=>c!=null) ? cs.reduce((a,b)=>a+b,0)/cs.length : null;
  }
  const cand = DATA.cost.sells.filter(s=>base(s.lotCode).toUpperCase()===String(code).toUpperCase() && s.finalCost!=null)
    .map(s=>({c:s.finalCost, d:(lotOf(s.lotCode)||{}).date||""})).sort((a,b)=>a.d.localeCompare(b.d));
  if(!cand.length) return null;
  let pick = cand[0]; cand.forEach(x=>{ if(x.d && x.d<=date) pick=x; });
  return pick.c;
}

function incomeList(){
  const list = [];
  DATA.orders.filter(o=>isPaid(o) && o.date).forEach(o=>list.push({kind:"order", date:o.date, name:o.id, sub:o.customer, amount:orderTotal(o), o}));
  DATA.tx.filter(t=>t.type==="รายรับ").forEach(t=>list.push({kind:"tx", date:t.date, name:t.detail||t.category, sub:t.category, amount:t.amount, t}));
  return list;
}
function expenseList(){
  const list = [];
  DATA.tx.filter(t=>t.type==="รายจ่าย").forEach(t=>list.push({kind:"tx", date:t.date, name:t.detail||t.category, sub:t.category, amount:t.amount, t}));
  DATA.cost.lots.forEach(l=>{ if(!l.date) return;
    if(l.baht) list.push({kind:"cost", date:l.date, name:`${l.lotCode} ${prodName(l.code)} (${l.amount} ${l.unit})`, sub:DATA.cats.goods, amount:l.baht});
    const sh=l.shipCN+l.shipTH+l.shipOther; if(sh) list.push({kind:"cost", date:l.date, name:`ค่าขนส่ง ${l.lotCode} ${prodName(l.code)}`, sub:DATA.cats.inbound, amount:sh}); });
  DATA.cost.packs.forEach(p=>{ if(!p.date) return;
    if(p.baht) list.push({kind:"cost", date:p.date, name:`${p.lotCode} ${p.name} (${p.amount} ${p.unit})`, sub:DATA.cats.pack, amount:p.baht});
    const sh=p.shipCN+p.shipTH+p.shipOther; if(sh) list.push({kind:"cost", date:p.date, name:`ค่าขนส่ง ${p.lotCode} ${p.name}`, sub:DATA.cats.inbound, amount:sh}); });
  return list;
}
function byMonth(list){
  const m = {};
  list.forEach(x=>{ const k=x.date.slice(0,7); (m[k] = m[k] || []).push(x); });
  return Object.keys(m).sort().reverse().map(k=>({ym:k, items:m[k].sort((a,b)=>sortDesc(a,b)), total:r2(m[k].reduce((a,x)=>a+x.amount,0))}));
}
function profitOf(orders){
  let sales=0, cogs=0, miss=0;
  orders.forEach(o=>{ sales += orderSub(o) - o.discount;
    liveItems(o).forEach(i=>{ const c=unitCost(i.code, o.date); if(c==null) miss++; else cogs += c*i.qty; }); });
  return {sales:r2(sales), cogs:r2(cogs), profit:r2(sales-cogs), miss};
}
function monthTotals(ym){
  const inc = incomeList().filter(x=>x.date.startsWith(ym)).reduce((a,x)=>a+x.amount,0);
  const exp = expenseList().filter(x=>x.date.startsWith(ym)).reduce((a,x)=>a+x.amount,0);
  return {inc:r2(inc), exp:r2(exp), net:r2(inc-exp)};
}

window.addEventListener("hashchange", ()=>{ closeSheet(); render(); window.scrollTo(0,0); });
function route(){ const [v,t] = (location.hash.slice(1) || "home").split("/"); return {v, t}; }
function render(){

  const V = { home:vHome, orders:vOrders, income:vIncome, expense:vExpense, products:vProducts, costs:vCosts, rates:vRates, summary:vSummary }[v] || vHome;

const bar = (title) => `<div class="bar"><button class="back" data-act="home">← หน้าแรก</button><h2>${title}</h2></div>`;
const tabs = (v, cur, list) => `<div class="tabs">${list.map(([k,l,n])=>`<button class="${k===cur?"on":""}" data-go="${v}/${k}">${l}${n?`<span class="n">${n}</span>`:""}</button>`).join("")}</div>`;
const statusPill = s => { const c = {"รอโอน":"p-grey","รอตรวจสลิป":"p-amber","ชำระแล้ว":"p-sky","ชำระเงินแล้ว":"p-sky","จัดส่งแล้ว":"p-green","ยกเลิก":"p-red"}[s] || "p-grey"; return `<span class="pill ${c}">${esc(s||"–")}</span>`; };
const stockPill = s => { if(!s) return `<span class="pill p-grey">ไม่ได้ขายบนเว็บ</span>`; const c={"มีของ":"p-green","ใกล้หมด":"p-amber","หมด":"p-red","ขายเกิน":"p-red"}[s.status]||"p-grey"; return `<span class="pill ${c}">${esc(s.status)} · เหลือ ${s.left}</span>`; };

function vOrders(t){
  t = t || "history";
  const slip = DATA.orders.filter(o=>o.status==="รอตรวจสลิป").length, ship = DATA.orders.filter(needsShip).length, wait = DATA.orders.filter(o=>o.status==="รอโอน").length;
  let body = "";
  if(t==="history") body = ordersHistory();
  if(t==="add") body = `<section class="card"><h2>➕ เพิ่มคำสั่งซื้อ</h2><p class="note">สำหรับลูกค้าที่ไม่ได้สั่งผ่านลิงก์ร้าน (หน้าร้าน / แชท) — บันทึกแล้วตัดสต็อกในไฟล์ stock ให้เลย</p><div id="ofBox"></div></section>`;
  if(t==="ship") body = ordersShip();
  if(t==="wait") body = ordersWait();
  setTimeout(()=>{ if(t==="add"){ if(!OF || OF.id) OF = newOF(); drawOF("#ofBox"); } }, 0);
  return bar("🧾 คำสั่งซื้อ") + tabs("orders", t, [["history","ประวัติ",slip],["add","+ เพิ่ม"],["ship","แจ้งเลขพัสดุ",ship],["wait","รอโอน",wait]]) + body;
}
function ordersHistory(){
  const f = UI.filter.orders || "all", q = (UI.q.orders||"").toLowerCase();
  let list = DATA.orders.filter(o=>["จัดส่งแล้ว","รอตรวจสลิป","ชำระแล้ว","ชำระเงินแล้ว"].includes(o.status));
  if(f!=="all") list = list.filter(o=> f==="ชำระแล้ว" ? (o.status==="ชำระแล้ว"||o.status==="ชำระเงินแล้ว") : o.status===f);
  if(q) list = list.filter(o=>[o.id,o.customer,o.phone,o.ig,o.tracking,...o.items.map(i=>i.code+" "+i.name)].join(" ").toLowerCase().includes(q));
  list.sort((a,b)=>sortDesc(a,b) || b.id.localeCompare(a.id));
  const chip = (k,l) => `<button class="chip ${f===k?"on":""}" data-act="filter" data-k="orders" data-v="${k}">${l}</button>`;
  return `<input type="search" class="search" placeholder="🔍 ค้นหา เลขออเดอร์ / ชื่อลูกค้า / เลขพัสดุ" value="${esc(UI.q.orders||"")}" data-q="orders">
  <div class="chips" style="margin-bottom:10px">${chip("all","ทั้งหมด")}${chip("รอตรวจสลิป","รอตรวจสลิป")}${chip("ชำระแล้ว","ชำระแล้ว")}${chip("จัดส่งแล้ว","จัดส่งแล้ว")}</div>
  <section class="card">${list.length ? list.map(orderRow).join("") : `<div class="empty">ไม่มีคำสั่งซื้อ</div>`}</section>
  <p class="note">แสดงเฉพาะสถานะ รอตรวจสลิป / ชำระแล้ว / จัดส่งแล้ว — ออเดอร์ที่ยังไม่โอนอยู่ในแท็บ "รอโอน"</p>`;
}

function ordersShip(){
  const todo = DATA.orders.filter(needsShip).sort((a,b)=>a.date.localeCompare(b.date));
  const q = (UI.q.ship||"").toLowerCase();
  let done = DATA.orders.filter(o=>o.tracking).sort((a,b)=>sortDesc(a,b));
  if(q) done = done.filter(o=>[o.id,o.customer,o.tracking].join(" ").toLowerCase().includes(q));
  const card = (o, isDone) => `<div class="row" style="display:block"><div class="sec" style="margin:0"><div><div class="t">${esc(o.id)} ${statusPill(o.status)}</div>
    <div class="d">${dTH(o.date)} · ${esc(o.customer)} · ${esc(o.shipMethod||"")}</div></div><button class="mini" data-act="openOrder" data-id="${esc(o.id)}">ดู</button></div>
    ${isDone && !UI.open["trk:"+o.id] ? `<div class="sec mt" style="margin-bottom:0"><div>📦 <b>${esc(o.tracking)}</b></div><button class="mini" data-act="editTrack" data-id="${esc(o.id)}">✏️ แก้ไข</button></div>`
      : `<div class="track"><input type="text" id="trk-${esc(o.id)}" value="${esc(o.tracking)}" placeholder="ใส่เลขพัสดุ" autocapitalize="characters"><button class="mini go" data-act="saveTrack" data-id="${esc(o.id)}" data-src="trk-${esc(o.id)}">บันทึก</button></div>`}</div>`;
  return `<section class="card"><h2>📮 รอใส่เลขพัสดุ (${todo.length})</h2><p class="note">ออเดอร์ที่ชำระแล้วและต้องส่งของ — ใส่เลขแล้วสถานะจะเปลี่ยนเป็น "จัดส่งแล้ว" ให้เอง</p>
    ${todo.length ? todo.map(o=>card(o,false)).join("") : `<div class="empty">ส่งครบทุกออเดอร์แล้ว 🎉</div>`}</section>
    <section class="card"><h2>✅ ใส่เลขแล้ว</h2><input type="search" class="search" placeholder="🔍 ค้นหา" value="${esc(UI.q.ship||"")}" data-q="ship">
    ${done.length ? done.slice(0, q?100:30).map(o=>card(o,true)).join("") : `<div class="empty">ยังไม่มี</div>`}</section>`;
}

function ofTotal(){
  const el = $("#ofTotal"); if(!el) return;

  el.innerHTML = `สินค้า ${baht(sub)}${num(OF.discount)?` − ส่วนลด ${baht(num(OF.discount))}`:""}${num(OF.shipFee)?` + ค่าส่ง ${baht(num(OF.shipFee))}`:""}<br>รวม <b class="big">${baht(t)}</b>`;

async function ofSave(force){
  const items = OF.items.filter(i=>i.code && num(i.qty)>0).map(i=>({code:i.code, qty:num(i.qty), price:num(i.price)}));
  if(!items.length) return toast(ERR.items);
  const order = {date:OF.date, channel:OF.channel, customer:OF.customer.trim(), phone:OF.phone.trim(), ig:OF.ig.trim(), address:OF.address.trim(), note:OF.note.trim(),
    shipMethod:OF.shipMethod, shipFee:num(OF.shipFee), discount:num(OF.discount), status:OF.status, tracking:OF.tracking.trim(), items};
  const editing = !!OF.id;
  const r = await act(editing?"order_edit":"order_add", editing ? {id:OF.id, order, force:!!force} : {order, force:!!force}, editing?"✅ แก้ไขออเดอร์แล้ว":null);
  if(r.ok){
    if(!editing) toast(`✅ บันทึก ${r.id} แล้ว · ตัดสต็อกแล้ว`);
    OF = editing ? null : newOF(); closeSheet(); render();
  } else if(r.reason==="stock"){ OF.short = r.short; drawOF(editing?"#sheetBody":"#ofBox"); }
}

async function tfSave(){
  const amount = tfBaht();

  if(!TF.category) return toast(ERR.category);
  const body = {type:TF.type, category:TF.category, detail:TF.detail.trim(), amount, date:TF.date||today(), pay:TF.pay};
  if(TF.cur==="CNY"){ body.yuan = num(TF.amount); body.rate = num(TF.rate); store.set("adminRate", TF.rate); }
  if(TF.blob){ body.mime="image/jpeg"; body.image = await b64(TF.blob); }
  const r = TF.id ? await act("tx_edit", {...body, row:TF.row, id:TF.id}, "✅ แก้ไขแล้ว") : await act("tx_add", body, `✅ บันทึก${TF.type} ${baht(amount)}`);
  if(r.ok){ closeSheet(); render(); }
}

/* ---------------- sheet / toast / busy ---------------- */
function openSheet(title, html){ $("#sheetTitle").textContent = title; $("#sheetBody").innerHTML = html; $("#sheet").classList.remove("hide"); document.body.style.overflow="hidden"; $("#sheet .box").scrollTop = 0; }
function closeSheet(){ $("#sheet").classList.add("hide"); $("#sheetBody").innerHTML = ""; document.body.style.overflow=""; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",2800); }
function busy(on, label){ $("#busy").classList.toggle("on", !!on); if(label) $("#busyText").textContent = label; }
function shrink(file, maxSide, q){
  return new Promise((res, rej)=>{ const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ const s=Math.min(1,maxSide/Math.max(img.width,img.height)), c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",q); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("load")); }; img.src = url; });
}
const b64 = blob => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });

function demoRecalc(D){

  D.cost.sells.forEach(s=>{ const l = D.cost.lots.find(x=>x.lotCode===s.lotCode); const pk = D.cost.packs.find(p=>p.lotCode===s.pack);

    s.profit = s.price && s.finalCost!=null ? s.price - s.finalCost : null; s.margin = s.profit!=null ? s.profit/s.price : null; s.sellCode = s.lotCode+"-"+s.pack; });

}
let DD = null;
function demoApi(action, b){
  if(PIN!=="2580") return {ok:false, reason:"pin"};
  if(!DD) DD = demoData();
  const D = DD, ord = id => D.orders.find(o=>o.id===id);
  const mkItems = (o, st) => o.items.map(i=>({row:0, code:i.code, name:(D.stock.find(s=>s.code===i.code)||{}).th||i.code, qty:i.qty, price:i.price, sub:i.qty*i.price, status:st}));
  const res = {};
  switch(action){
    case "boot": break;
    case "slip": return {ok:true, mime:"image/svg+xml", image:btoa('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420"><rect width="300" height="420" fill="#e3f4fc"/><text x="150" y="210" font-size="22" text-anchor="middle" fill="#1f4f7d">DEMO SLIP</text></svg>')};
    case "order_add": case "order_edit": {
      const o = b.order; let st = o.status; if(o.tracking && st!=="ยกเลิก") st = "จัดส่งแล้ว";
      if(!b.force && st!=="ยกเลิก"){ const old = action==="order_edit" ? ord(b.id).items : [];
        const short = o.items.filter(i=>{ const s=D.stock.find(x=>x.code===i.code); const back = old.filter(x=>x.code===i.code && x.status!=="ยกเลิก").reduce((a,x)=>a+x.qty,0); return i.qty > (s?s.left:0)+back; })
          .map(i=>({code:i.code, left:Math.max(0,(D.stock.find(x=>x.code===i.code)||{left:0}).left), missing:!D.stock.find(x=>x.code===i.code)}));
        if(short.length) return {ok:false, reason:"stock", short}; }
      let id = b.id;
      if(action==="order_add"){ const pre = /แชท/.test(o.channel)?"CHAT":"ONSITE"; const n = Math.max(0,...D.orders.map(x=>(x.id.match(new RegExp("^"+pre+"-(\\d+)$"))||[])[1]||0).map(Number))+1; id = pre+"-"+String(n).padStart(4,"0"); D.orders.push({id, slip:false}); res.id = id; }
      Object.assign(ord(id), {date:o.date, channel:o.channel, customer:o.customer||"ลูกค้าหน้าร้าน", phone:o.phone, ig:o.ig, address:o.address, note:o.note, shipMethod:o.shipMethod, shipFee:o.shipFee, discount:o.discount, status:st, tracking:o.tracking, items:mkItems(o, st)});
      break; }
    case "order_status": { const o = ord(b.id); o.status = b.status; o.items.forEach(i=>{ if(b.status==="ยกเลิก" || i.status!=="ยกเลิก") i.status=b.status; }); break; }
    case "order_tracking": { const o = ord(b.id); o.tracking = b.tracking; if(o.status!=="ยกเลิก"){ o.status = b.tracking ? "จัดส่งแล้ว" : (o.status==="จัดส่งแล้ว"?"ชำระแล้ว":o.status); o.items.forEach(i=>i.status=o.status); } break; }
    case "tx_add": D.tx.push({row:D.tx.length+10, id:"TXD"+Date.now(), date:b.date, type:b.type, category:b.category, detail:b.detail, amount:b.amount, pay:b.pay, yuan:b.yuan||null, rate:b.rate||null, receipt:!!b.image}); break;
    case "tx_edit": Object.assign(D.tx.find(t=>t.id===b.id), {date:b.date, type:b.type, category:b.category, detail:b.detail, amount:b.amount, pay:b.pay, yuan:b.yuan||null, rate:b.rate||null}); break;
    case "tx_delete": D.tx = D.tx.filter(t=>t.id!==b.id); break;
    case "product_add": case "product_edit": {
      if(action==="product_add" && D.products.some(p=>p.code===b.code)) return {ok:false, reason:"exists"};
      let n = D.cost.names.find(x=>x.code===b.code); if(!n && (action==="product_add"||b.addToCost)){ n={row:D.cost.names.length+2, code:b.code}; D.cost.names.push(n); }
      if(n) Object.assign(n, {th:b.th, cn:b.cn, brand:b.brand});
      let s = D.stock.find(x=>x.code===b.code);
      if(!s && b.toStock){ s = {row:D.stock.length+2, code:b.code, inn:0, sold:0, left:0, alert:3}; D.stock.push(s); }
      if(s){ Object.assign(s, {th:b.th, cn:b.cn, brand:b.brand}); if(b.toStock) Object.assign(s, {price:b.price, weight:b.weight, alert:b.alert===""?3:b.alert, cat:b.cat, unit:b.unit, img:b.img, promo:b.promo, show:b.show});
        const ls = D.cost.sells.filter(x=>base(x.lotCode)===b.code).pop(); if(ls && b.price) ls.price = b.price; }
      break; }
    case "restock_add": D.stock.find(s=>s.code===b.code).inn += b.qty; break;
    case "lot_add": { let n = D.cost.names.find(x=>x.code===b.code); if(!n){ D.cost.names.push({row:D.cost.names.length+2, code:b.code, th:b.th, cn:b.cn, brand:b.brand}); }
      if(b.cur==="CNY" && !D.cost.rates.some(r=>r.date===b.date)) D.cost.rates.push({row:D.cost.rates.length+2, date:b.date, rate:b.rate, plan:null});
      const lot = 1+Math.max(0,...D.cost.lots.filter(l=>l.code===b.code).map(l=>l.lot));
      const l = {row:D.cost.lots.length+2, code:b.code, name:b.cn||b.code, lot, lotCode:b.code+"-"+lot, date:b.date, amount:b.amount, unit:b.unit, yuan:b.cur==="CNY"?b.price:null, baht:b.cur==="THB"?b.price:0, cur:b.cur, shipCN:b.shipCN, shipTH:b.shipTH, shipOther:b.shipOther};
      D.cost.lots.push(l); D.cost.sells.push({row:D.cost.sells.length+2, lotCode:l.lotCode, pack:b.pack, per:b.sellPer, unit:b.sellUnit, price:b.sellPrice||null});
      demoRecalc(D); const s = D.cost.sells[D.cost.sells.length-1]; res.lotCode = l.lotCode;
      res.result = {total:l.total, perUnit:l.perUnit, finalCost:s.finalCost, minSell:s.minSell, sellPrice:s.price, profit:s.profit, margin:s.margin};
      const st = D.stock.find(x=>x.code===b.code); if(st && b.sellPrice) st.price = b.sellPrice; break; }
    case "lot_edit": { const l = D.cost.lots.find(x=>x.row===b.row);
      if(b.cur==="CNY" && !D.cost.rates.some(r=>r.date===b.date)) D.cost.rates.push({row:D.cost.rates.length+2, date:b.date, rate:b.rate, plan:null});
      Object.assign(l, {date:b.date, amount:b.amount, unit:b.unit, cur:b.cur, yuan:b.cur==="CNY"?b.price:null, baht:b.cur==="THB"?b.price:0, shipCN:b.shipCN, shipTH:b.shipTH, shipOther:b.shipOther});
      const s = D.cost.sells.find(x=>x.row===b.sellRow); Object.assign(s, {pack:b.pack, per:b.sellPer, unit:b.sellUnit, price:b.sellPrice||s.price});
      const latest = D.cost.sells.filter(x=>base(x.lotCode)===l.code).pop(); if(latest===s){ const st=D.stock.find(x=>x.code===l.code); if(st && b.sellPrice) st.price=b.sellPrice; } break; }
    case "pack_add": { const lot = 1+Math.max(0,...D.cost.packs.filter(p=>p.code===b.code).map(p=>p.lot));
      D.cost.packs.push({row:D.cost.packs.length+2, name:b.name, brand:b.brand, code:b.code, lot, lotCode:b.code+"-"+lot, date:b.date, amount:b.amount, unit:b.unit, yuan:b.cur==="CNY"?b.price:null, baht:b.cur==="THB"?b.price:0, cur:b.cur, shipCN:b.shipCN, shipTH:b.shipTH, shipOther:b.shipOther}); break; }
    case "pack_edit": Object.assign(D.cost.packs.find(p=>p.row===b.row), {name:b.name, brand:b.brand, date:b.date, amount:b.amount, unit:b.unit, cur:b.cur, yuan:b.cur==="CNY"?b.price:null, baht:b.cur==="THB"?b.price:0, shipCN:b.shipCN, shipTH:b.shipTH, shipOther:b.shipOther}); break;
    case "rate_add": if(D.cost.rates.some(r=>r.date===b.date)) return {ok:false, reason:"exists"}; D.cost.rates.push({row:D.cost.rates.length+2, date:b.date, rate:b.rate, plan:null}); break;
    case "rate_edit": { const r = D.cost.rates.find(x=>x.row===b.row); if(b.date!==b.oldDate && (D.cost.lots.some(l=>l.date===b.oldDate)||D.cost.packs.some(p=>p.date===b.oldDate))) return {ok:false, reason:"inuse"}; r.date=b.date; r.rate=b.rate; break; }
  }
  demoRecalc(D);
  return {ok:true, ...res, data:JSON.parse(JSON.stringify(D))};
}

/* ---------------- เริ่ม ---------------- */
if(PIN) boot(); else showPin();
</script>
